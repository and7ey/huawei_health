name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    name: Build and attach the HACS package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match manifest.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/huawei_health/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json says $version, the tag says $tag" >&2
            exit 1
          fi

      - name: Create HACS-compatible archive
        run: |
          # Remove __pycache__ dirs first
          find custom_components/huawei_health -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          
          # Zip only the integration files directly to root of archive (no wrapper folder)
          # This ensures proper installation path in HA
          cd custom_components/huawei_health
          zip -r ../../huawei_health.zip *

      - uses: softprops/action-gh-release@v2
        with:
          files: huawei_health.zip
          generate_release_notes: true
