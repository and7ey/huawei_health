name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    name: Build and attach the HACS package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match manifest.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/huawei_health/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json says $version, the tag says $tag" >&2
            exit 1
          fi

      - name: Create HACS-compatible archive
        run: |
          # Create temp directory with correct structure for HA
          mkdir -p _package/huawei_health
          cp -r custom_components/huawei_health/* _package/huawei_health/
          
          # Remove __pycache__ dirs
          find _package/huawei_health -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          
          # Zip the folder named 'huawei_health' at root of archive
          cd _package
          zip -r ../huawei_health.zip huawei_health

      - uses: softprops/action-gh-release@v2
        with:
          files: huawei_health.zip
          generate_release_notes: true
