name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  validate:
    name: Validate the repository for HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
